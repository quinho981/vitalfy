server {
    listen 80;
    server_name vitalfy.health www.vitalfy.health;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name vitalfy.health www.vitalfy.health;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    # BE-R14-01 (ai-vitalfy/risks.md#r14): resolver do DNS embutido do Docker
    # Compose, usado junto com $upstream_landing abaixo para reresolver
    # "landing" em vez de resolver uma única vez no boot do processo — ver
    # o comentário equivalente em vitalfy-api/docker/nginx/default.conf.
    resolver 127.0.0.11 valid=10s;

    # BE-R10-01 (ai-vitalfy/risks.md#r10): headers de segurança de baixo
    # risco, sem dependência de allowlist de recursos externos.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # BE-R10-02 (ai-vitalfy/risks.md#r10): landing depende de CDN (Tailwind,
    # Lucide) e scripts inline sem nonce (R13, fora do escopo aqui) — CSP
    # mais permissiva que app.conf, só o suficiente para não quebrar.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.tailwindcss.com https://unpkg.com 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    location / {
        set $upstream_landing landing;
        proxy_pass http://$upstream_landing:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
