server {
    listen 80;
    server_name app.vitalfy.health;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.vitalfy.health;

    ssl_certificate     /etc/nginx/certs/cloudflare-origin.pem;
    ssl_certificate_key /etc/nginx/certs/cloudflare-origin.key;

    client_max_body_size 100M;

    # BE-R14-01 (ai-vitalfy/risks.md#r14): resolver do DNS embutido do Docker
    # Compose, usado junto com $upstream_frontend abaixo para reresolver
    # "frontend" em vez de resolver uma única vez no boot do processo — ver
    # o comentário equivalente em vitalfy-api/docker/nginx/default.conf.
    resolver 127.0.0.11 valid=10s;

    # BE-R10-01 (ai-vitalfy/risks.md#r10): headers de segurança de baixo
    # risco, sem dependência de allowlist de recursos externos.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # BE-R10-02 (ai-vitalfy/risks.md#r10): SPA é 100% same-origin, sem CDN —
    # script-src estrito, sem 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        set $upstream_frontend frontend;
        proxy_pass http://$upstream_frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # BE-R1-01 (ai-vitalfy/risks.md#r1): não há bloco /api/ dedicado aqui,
        # então o tráfego de /api/transcripts/generate-document cai neste
        # location. Alinhado com o proxy_read_timeout do frontend e o
        # fastcgi_read_timeout do api-nginx — os três precisam do mesmo valor.
        # A Cloudflare (~100s, plano gratuito) continua cortando antes disso e
        # não é contornável por configuração aqui; ver BE-R1-06 na origem.
        proxy_read_timeout 180s;
    }
}
