server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # BE-R14-01 (ai-vitalfy/risks.md#r14): resolver do DNS embutido do Docker
    # Compose, usado junto com $upstream_api abaixo para reresolver
    # "api-nginx" em vez de resolver uma única vez no boot do processo — ver
    # o comentário equivalente em vitalfy-api/docker/nginx/default.conf.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $upstream_api api-nginx;
        proxy_pass http://$upstream_api:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # BE-R1-01 (ai-vitalfy/risks.md#r1): alinhado com fastcgi_read_timeout
        # do api-nginx e proxy_read_timeout do nginx-proxy. Os três saltos
        # precisam do mesmo valor — o menor deles é quem corta primeiro.
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
