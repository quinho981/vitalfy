server {
    listen 80;
    server_name api.vitalfy.health;

    index index.php index.html;
    root /var/www/public;

    client_max_body_size 100M;

    # BE-R14-01 (ai-vitalfy/risks.md#r14): resolver do DNS embutido do Docker
    # Compose. Combinado com $upstream_app abaixo, força o nginx a resolver
    # "app" a cada `valid` segundos em vez de uma única vez no boot do
    # processo. Sem isso, reconstruir o container `app` (ganha IP novo) deixa
    # este bloco preso ao IP antigo até um restart manual — foi a causa do
    # 502 de 08/08/2026 (ver tabela de R14 em risks.md).
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $upstream_app app;
        fastcgi_pass $upstream_app:9000;
        fastcgi_index index.php;
        include /etc/nginx/fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # BE-R1-01 (ai-vitalfy/risks.md#r1): sem isso, o default de 60s corta
        # /api/transcripts/generate-document antes do PHP (max_execution_time
        # 300s) terminar. 180s: acima do teto real da Cloudflare (~100s, não
        # contornável por config) e abaixo do teto do PHP, para que o
        # processamento sempre termine e persista o resultado no servidor
        # mesmo quando o cliente já recebeu 524 da Cloudflare.
        fastcgi_read_timeout 180s;
    }

    location ~ /\.ht {
        deny all;
    }
}
